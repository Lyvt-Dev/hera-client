name: Bundle Hera mod
# Builds the 1.21.11 Fabric mod and commits the jar into the launcher's bundled resources
# whenever the mod version changes, so the next launcher release ships it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - minecraft/fabric-1.21.11/build.gradle
      - .github/workflows/bundle-mod.yml
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.2.1}
      - run: gradle -p minecraft/fabric-1.21.11 build --no-daemon
      - name: Bundle jar into launcher
        run: |
          set -euo pipefail
          v=$(sed -n "s/^version = '\(.*\)'/\1/p" minecraft/fabric-1.21.11/build.gradle)
          jar="hera-fabric-1.21.11-$v.jar"
          res=apps/launcher/src-tauri/resources
          cp "minecraft/fabric-1.21.11/build/libs/$jar" "$res/$jar"
          sed -i -E "s/MOD_VERSION: &str = \"[0-9.]+\"/MOD_VERSION: \&str = \"$v\"/; s/hera-fabric-1\.21\.11-[0-9.]+\.jar/$jar/g" apps/launcher/src-tauri/src/bundled_mods.rs
          sed -i -E "s/HERA_MOD_VERSION = '[0-9.]+'/HERA_MOD_VERSION = '$v'/" apps/launcher/src/lib/hera-profile.ts
          JAR="$res/$jar" node -e '
            const fs=require("fs"),crypto=require("crypto"),p="apps/launcher/src-tauri/resources/bundled-mods.json";
            const b=fs.readFileSync(process.env.JAR),list=JSON.parse(fs.readFileSync(p,"utf8"));
            list[0]={size:b.length,filename:require("path").basename(process.env.JAR),sha256:crypto.createHash("sha256").update(b).digest("hex")};
            fs.writeFileSync(p,JSON.stringify(list,null,2)+"\n");'
          if git diff --quiet && git ls-files --error-unmatch "$res/$jar" >/dev/null 2>&1; then echo "Already bundled"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$res/$jar" "$res/bundled-mods.json" apps/launcher/src-tauri/src/bundled_mods.rs apps/launcher/src/lib/hera-profile.ts
          git commit -m "Bundle Hera mod $v into launcher"
          git push
