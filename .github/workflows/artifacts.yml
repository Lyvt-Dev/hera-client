name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --locked --manifest-path apps/launcher/src-tauri/Cargo.toml
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content apps/launcher/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Release tag and app version differ' }
      - run: ./scripts/installer.ps1 -Repository '${{ github.repository }}'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: hera-windows-installer
          path: releases/
      - name: Publish installer and updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('releases/latest.json', 'utf8'));
            const tag = `v${manifest.version}`;
            try {
              const {data: existing} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (!existing.draft) { core.info('Version was already published from a validated local build.'); return; }
              throw new Error('A draft already exists; inspect it before publishing again.');
            } catch (error) { if (error.status !== 404) throw error; }
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `Hera ${manifest.version}`,
              body: manifest.notes, draft: true, prerelease: false
            });
            const setup = `Hera.Client_${manifest.version}_x64-setup.exe`;
            for (const name of [setup, `${setup}.sig`, 'latest.json', 'SHA256SUMS.txt']) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(`releases/${name}`)
              });
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false});
