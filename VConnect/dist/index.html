<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>VConnect — Deine nächste Connection</title><meta name="description" content="Dein Ort für VTuber, neue Lieblingsstreams und gemeinsame Collabs."><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><div id="app"></div><dialog id="profileDialog"><form id="profileForm"><div class="dialog-title"><h2>Deine Bühne. Dein Profil.</h2><button type="button" data-close aria-label="Schließen">×</button></div><p>Zeig der Community, wer hinter deinem Avatar steckt.</p><label>Anzeigename<input name="name" required maxlength="40" placeholder="Dein VTuber-Name"></label><label>Deine Rolle<select name="role"><option>VTuber</option><option>Zuschauer</option></select></label><label>Über dich<textarea name="bio" maxlength="280" placeholder="Dein Vibe, deine Games, deine Community …"></textarea></label><label>Interessen<input name="tags" maxlength="100" placeholder="Gaming, Just Chatting, Art"></label><label>Dein Stream / Social-Link<input name="link" type="url" placeholder="https://…"></label><label>Twitch<input name="twitch" type="url" maxlength="500" placeholder="https://twitch.tv/…"></label><label>YouTube<input name="youtube" type="url" maxlength="500" placeholder="https://youtube.com/@…"></label><label>Weiterer Social-Link<input name="social" type="url" maxlength="500" placeholder="https://…"></label><label class="check"><input name="collab" type="checkbox"> Offen für Collabs</label><button class="primary" type="submit">Profil speichern ↗</button><p id="formError" role="alert"></p></form></dialog><div id="toast" role="status"></div></body></html>
